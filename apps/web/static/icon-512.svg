<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1B4E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D0B14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#0D0B14"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Ring with Imperial Gold -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 8" filter="url(#goldGlow)"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Bagua Trigrams Ring (Indicative Rays) -->
  <g stroke="url(#goldGrad)" stroke-width="3" opacity="0.8">
    <line x1="256" y1="40" x2="256" y2="65"/>
    <line x1="256" y1="447" x2="256" y2="472"/>
    <line x1="40" y1="256" x2="65" y2="256"/>
    <line x1="447" y1="256" x2="472" y2="256"/>
    <line x1="103" y1="103" x2="121" y2="121"/>
    <line x1="391" y1="391" x2="409" y2="409"/>
    <line x1="103" y1="409" x2="121" y2="391"/>
    <line x1="391" y1="121" x2="409" y2="103"/>
  </g>

  <!-- Yin Yang / Taiji Core -->
  <g transform="translate(256, 256)">
    <!-- Base Circle -->
    <circle cx="0" cy="0" r="130" fill="#0D0B14" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Light Half -->
    <path d="M 0 -130 A 130 130 0 0 1 0 130 A 65 65 0 0 1 0 0 A 65 65 0 0 0 0 -130 Z" fill="url(#goldGrad)"/>
    
    <!-- Dots -->
    <circle cx="0" cy="-65" r="18" fill="#0D0B14"/>
    <circle cx="0" cy="65" r="18" fill="url(#goldGrad)"/>
  </g>

  <!-- Four Cardinal Stars -->
  <polygon points="256,80 262,96 278,96 265,106 270,122 256,112 242,122 247,106 234,96 250,96" fill="url(#goldGrad)"/>
</svg>
